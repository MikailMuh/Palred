name: Update prices

on:
  schedule:
    # 03:00 and 09:00 UTC = 10:00 and 16:00 WIB. PIHPS publish time is unknown, so run twice.
    - cron: "0 3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch prices
        run: python scripts/fetch-prices.py

      - name: Commit changes
        run: |
          git config user.name "palred-bot"
          git config user.email "palred-bot@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update prices data"
          git pull --rebase
          git push
